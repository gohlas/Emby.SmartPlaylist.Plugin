name: Build Windows DLL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.x'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Build frontend
        working-directory: frontend
        run: |
          yarn install
          yarn build

      - name: Build backend
        working-directory: backend
        run: dotnet build --configuration Release

      - name: Collect artifact
        run: |
          mkdir dist
          copy backend\SmartPlaylist\bin\Release\netstandard2.0\SmartPlaylist.dll dist\