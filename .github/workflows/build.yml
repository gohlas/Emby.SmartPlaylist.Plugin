name: Build

on:
  push:
    branches:
      - 2.5.1.4850
  pull_request:
    branches:
      - 2.5.1.4850
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.x'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Build Frontend
        working-directory: frontend
        run: |
          yarn install
          yarn build

      - name: Build Backend
        working-directory: backend
        run: dotnet build --configuration Release

      - name: Find build output (debug)
        run: find backend -name "SmartPlaylist.dll" 2>/dev/null || echo "DLL not found"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find backend -name "SmartPlaylist.dll" -path "*/bin/Release/*" -exec cp {} dist/ \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartPlaylist-Plugin
          path: dist/SmartPlaylist.dll
          if-no-files-found: error