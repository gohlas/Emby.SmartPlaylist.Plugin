name: Build

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.x'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Build Frontend
        working-directory: frontend
        run: |
          yarn install
          yarn build

      - name: Build Backend
        working-directory: backend
        run: dotnet build --configuration Release

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp backend/SmartPlaylist/bin/Release/netstandard2.0/SmartPlaylist.dll dist/
          cp frontend/dist/* dist/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartPlaylist-Plugin
          path: dist/
          if-no-files-found: error